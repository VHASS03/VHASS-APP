org.gradle.jvmargs=-Xmx768M -XX:ReservedCodeCacheSize=96m -XX:-HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Limit resource usage for low-RAM Windows systems to prevent compiler thread crashes
org.gradle.parallel=false
org.gradle.workers.max=1

# Limit Kotlin compiler daemon memory usage
kotlin.daemon.jvmargs=-Xmx512M -XX:MaxMetaspaceSize=128m -XX:CICompilerCount=2
kotlin.compiler.execution.strategy=in-process
